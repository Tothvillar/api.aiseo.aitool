<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="100%" style="stop-color:#b44eff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.5"/>
  <!-- Neural nodes -->
  <circle cx="100" cy="60" r="5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="135" cy="85" r="5" fill="#b44eff" filter="url(#glow)"/>
  <circle cx="130" cy="125" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="85" cy="140" r="4" fill="#b44eff" filter="url(#glow)"/>
  <circle cx="65" cy="95" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <!-- Connections -->
  <line x1="100" y1="60" x2="135" y2="85" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>
  <line x1="135" y1="85" x2="130" y2="125" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>
  <line x1="130" y1="125" x2="85" y2="140" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>
  <line x1="85" y1="140" x2="65" y2="95" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="95" x2="100" y2="60" stroke="url(#g)" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="60" x2="130" y2="125" stroke="#00f0ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="135" y1="85" x2="85" y2="140" stroke="#b44eff" stroke-width="0.8" opacity="0.3"/>
  <!-- Center -->
  <circle cx="100" cy="100" r="10" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="4" fill="#00f0ff" filter="url(#glow)"/>
  <!-- AI letters (subtle) -->
  <text x="100" y="180" text-anchor="middle" fill="url(#g)" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="8" opacity="0.6">AITOOLS</text>
</svg>