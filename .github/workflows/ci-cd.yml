name: CI/CD 完整流水线

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # =========================
  # 阶段1：单元测试
  # =========================
  unit-test:
    name: 🧪 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 运行单元测试
        run: npm test

      - name: 📊 发布测试报告
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 单元测试结果
          path: junit.xml
          reporter: jest-junit

      - name: 📈 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # =========================
  # 阶段2：功能测试 (E2E)
  # =========================
  e2e-test:
    name: 🎭 功能测试 (E2E)
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 🎭 运行功能测试
        run: npx playwright test

      - name: 📸 上传功能测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 30

      - name: 📸 失败截图
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-screenshots
          path: test-results/
          retention-days: 7

  # =========================
  # 阶段3：构建 + 打包
  # =========================
  build:
    name: 🔨 构建 & 打包
    needs: e2e-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 🔨 编译打包（压缩HTML/CSS/JS）
        run: npm run build

      - name: 📦 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 30

      - name: 📋 构建信息
        run: |
          echo "## 构建摘要" >> $GITHUB_STEP_SUMMARY
          if [ -f dist/build-info.json ]; then
            cat dist/build-info.json >> $GITHUB_STEP_SUMMARY
          fi

  # =========================
  # 阶段4：部署
  # =========================
  deploy:
    name: 🚀 部署
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: 🚀 部署前端到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: aiseo.one

      - name: ✅ 部署确认
        run: |
          echo "## 🚀 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 前端: https://aiseo.one" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # =========================
  # 阶段5：汇总通知
  # =========================
  notify:
    name: 📧 通知组员
    needs: [unit-test, e2e-test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 生成状态摘要
        run: |
          echo "## 📊 CI/CD 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "| 阶段 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ${{ needs.unit-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 功能测试 | ${{ needs.e2e-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建打包 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[查看构建详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: 📧 发送邮件通知
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >
            [${{ needs.unit-test.result == 'success' && '✅' || '❌' }}单元测试
             ${{ needs.e2e-test.result == 'success' && '✅' || '❌' }}E2E测试
             ${{ needs.build.result == 'success' && '✅' || '❌' }}构建
             ${{ needs.deploy.result == 'success' && '✅' || '❌' }}部署]
            api.aiseo.aitool 构建报告
          body: |
            ========== CI/CD 自动构建报告 ==========
            项目: api.aiseo.aitool (aiseo.one)
            分支: ${{ github.ref_name }}
            提交信息: ${{ github.event.head_commit.message }}
            提交人: ${{ github.event.head_commit.author.name }}
            提交时间: ${{ github.event.head_commit.timestamp }}

            ────────── 各阶段结果 ──────────
            单元测试: ${{ needs.unit-test.result }}
            功能测试: ${{ needs.e2e-test.result }}
            构建打包: ${{ needs.build.result }}
            自动部署: ${{ needs.deploy.result }}

            🔗 查看构建详情:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            🌐 访问系统:
            https://aiseo.one
            =====================================
          to: ${{ secrets.NOTIFY_EMAILS }}
          from: AI工具库 CI机器人
